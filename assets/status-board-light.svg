<svg xmlns="http://www.w3.org/2000/svg" width="300" height="302" viewBox="0 0 300 302" role="img" aria-label="10 of 10 sites I built are up">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; }
    .host { fill: #1f2328; }
    .head { fill: #1a7f37; font-weight: 600; }
    .sub { fill: #59636e; font-size: 11px; }
    .dot.up { animation: beat 2.4s ease-in-out infinite; }
    .dot.down { animation: blink 0.8s steps(2) infinite; }
    .cursor { animation: blink 1s steps(2) infinite; }
    @keyframes beat { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .dot, .cursor { animation: none; } }
  </style>
